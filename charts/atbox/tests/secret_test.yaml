suite: database secret
templates:
  - templates/secret.yaml
tests:
  - it: renders the database connection secret
    set:
      external.mysqlDsn: mysql:host=db;dbname=atom;charset=utf8mb4
      external.mysqlUsername: atom_test
      external.mysqlPassword: secret_test
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-database
      - equal:
          path: stringData.mysql-dsn
          value: mysql:host=db;dbname=atom;charset=utf8mb4
      - equal:
          path: stringData.mysql-username
          value: atom_test
      - equal:
          path: stringData.mysql-password
          value: secret_test
