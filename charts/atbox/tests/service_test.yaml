suite: services
templates:
  - templates/public-service.yaml
  - templates/admin-service.yaml
tests:
  - it: renders the public service by default
    template: templates/public-service.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-public
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: public

  - it: renders the admin service when enabled
    template: templates/admin-service.yaml
    set:
      atom.admin.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-admin
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: admin
