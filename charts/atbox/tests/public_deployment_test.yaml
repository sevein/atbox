suite: public deployment
templates:
  - templates/public-deployment.yaml
tests:
  - it: renders the readonly public runtime by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-public
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: atbox
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/sevein/atbox:2.10.1
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: ATOM_CACHE_NAMESPACE
            value: atom
      - equal:
          path: spec.template.spec.containers[0].env[7]
          value:
            name: ATOM_SESSION_NAME
            value: atom
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: NET_RAW

  - it: renders no public deployment when disabled
    set:
      atom.public.enabled: false
    asserts:
      - hasDocuments:
          count: 0
