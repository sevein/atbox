suite: public deployment
templates:
  - templates/public-deployment.yaml
tests:
  - it: renders the readonly public runtime by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-public
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: atbox
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/sevein/atbox-public:2.10.1
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: ATOM_CACHE_NAMESPACE
            value: atom
      - equal:
          path: spec.template.spec.containers[0].env[9]
          value:
            name: ATOM_SESSION_NAME
            value: atom
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: NET_RAW

  - it: mounts shared media storage read-only under the AtoM web root
    set:
      storage.uploads.existingClaim: atom-uploads
      storage.downloads.existingClaim: atom-downloads
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: uploads
            mountPath: /atom/src/uploads
            readOnly: true
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1]
          value:
            name: downloads
            mountPath: /atom/src/downloads
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: atom-uploads
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: atom-downloads

  - it: renders no public deployment when disabled
    set:
      atom.public.enabled: false
    asserts:
      - hasDocuments:
          count: 0
