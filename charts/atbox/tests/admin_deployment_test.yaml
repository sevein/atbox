suite: admin deployment
templates:
  - templates/admin-deployment.yaml
tests:
  - it: renders no admin deployment by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the admin runtime with configurable session settings
    set:
      atom.admin.enabled: true
      atom.admin.sessionName: atbox-admin-test
      atom.admin.sessionCookieSecure: false
      atom.admin.sessionCookieSameSite: strict
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atbox-admin
      - equal:
          path: spec.template.spec.containers[0].name
          value: atbox-admin
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/sevein/atbox-admin:2.10.1
      - equal:
          path: spec.template.spec.containers[0].env[9]
          value:
            name: ATOM_SESSION_NAME
            value: atbox-admin-test
      - equal:
          path: spec.template.spec.containers[0].env[10]
          value:
            name: ATOM_SESSION_COOKIE_SECURE
            value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[11]
          value:
            name: ATOM_SESSION_COOKIE_SAMESITE
            value: strict
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: NET_RAW

  - it: fails when admin uploads are enabled without shared storage
    set:
      atom.admin.enabled: true
      atom.admin.uploads.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: atom.admin.uploads.enabled requires storage.uploads.existingClaim and storage.downloads.existingClaim so admin, public, and worker share AtoM-generated files

  - it: renders admin uploads with shared storage
    set:
      atom.admin.enabled: true
      atom.admin.uploads.enabled: true
      storage.uploads.existingClaim: atom-uploads
      storage.downloads.existingClaim: atom-downloads
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[12]
          value:
            name: ATOM_UPLOADS_ENABLED
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: uploads
            mountPath: /atom/src/web/uploads
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: atom-uploads

  - it: fails when admin OIDC is enabled without a client secret reference
    set:
      atom.admin.enabled: true
      atom.admin.oidc.enabled: true
      atom.admin.oidc.providerUrl: https://keycloak.example.org/realms/atom
      atom.admin.oidc.clientId: atom-admin
      atom.admin.oidc.redirectUrl: https://atom.example.org/oidc/login
      atom.admin.oidc.logoutRedirectUrl: https://atom.example.org
    asserts:
      - failedTemplate:
          errorMessage: atom.admin.oidc.clientSecret.existingSecret is required when atom.admin.oidc.enabled=true

  - it: renders admin OIDC from a secret-backed confidential client
    set:
      atom.admin.enabled: true
      atom.admin.oidc.enabled: true
      atom.admin.oidc.providerUrl: https://keycloak.example.org/realms/atom
      atom.admin.oidc.clientId: atom-admin
      atom.admin.oidc.clientSecret.existingSecret: atom-admin-oidc
      atom.admin.oidc.clientSecret.key: client-secret
      atom.admin.oidc.redirectUrl: https://atom.example.org/oidc/login
      atom.admin.oidc.logoutRedirectUrl: https://atom.example.org
      atom.admin.oidc.userMatchingSource: oidc-username
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[12]
          value:
            name: ATOM_OIDC_ENABLED
            value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[15]
          value:
            name: ATOM_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: atom-admin-oidc
                key: client-secret
      - equal:
          path: spec.template.spec.containers[0].env[24]
          value:
            name: ATOM_OIDC_ROLES_PATH
            value: realm_access,roles
      - equal:
          path: spec.template.spec.containers[0].env[25]
          value:
            name: ATOM_OIDC_USER_MATCHING_SOURCE
            value: oidc-username
      - matchRegex:
          path: spec.template.spec.containers[0].env[27].value
          pattern: '"administrator":'
