# Debian normalizes HTTP_HOST to $host, which drops externally mapped ports.
# Prefer the absolute request target when present so a conflicting Host header
# cannot override the effective authority used by nginx.
map $request $atbox_request_authority {
  default $http_host;
  ~*^\S+\s+https?://(?<atbox_absolute_authority>[^/?\s]+) $atbox_absolute_authority;
}

# Only restore a numeric port when the authority matches nginx's parsed host.
map "$host|$atbox_request_authority" $atbox_fastcgi_host {
  default $host;
  ~*^(?<atbox_normalized_host>[^|]+)[|]\k<atbox_normalized_host>:(?<atbox_request_port>[0-9]+)$ $host:$atbox_request_port;
}
