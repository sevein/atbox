name: "Release"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag for images and chart appVersion (e.g. 2.10.1-dev1)"
        required: true
        type: string
      atom_version:
        description: "AtoM version to build into images when release_images is true (e.g. 2.10.1)"
        required: false
        default: ""
        type: string
      chart_version:
        description: "Helm chart version to publish when release_chart is true (e.g. 0.1.0)"
        required: false
        default: ""
        type: string
      release_images:
        description: "Build and publish container images"
        required: true
        default: true
        type: boolean
      release_chart:
        description: "Package and publish the Helm chart"
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.image_tag }}-${{ github.event.inputs.chart_version }}
  cancel-in-progress: true

env:
  GHCR_NAMESPACE: ghcr.io/sevein

jobs:
  validate-release:
    name: "Validate release inputs"
    runs-on: ubuntu-24.04
    steps:
      - name: "Validate selected artifacts"
        env:
          RELEASE_IMAGES: ${{ inputs.release_images }}
          RELEASE_CHART: ${{ inputs.release_chart }}
          ATOM_VERSION: ${{ inputs.atom_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          if [[ "${RELEASE_IMAGES}" != "true" && "${RELEASE_CHART}" != "true" ]]; then
            echo "Select at least one artifact family: release_images and/or release_chart." >&2
            exit 1
          fi

          if [[ "${RELEASE_IMAGES}" == "true" && -z "${ATOM_VERSION}" ]]; then
            echo "atom_version is required when release_images is true." >&2
            exit 1
          fi

          if [[ "${RELEASE_CHART}" == "true" && -z "${CHART_VERSION}" ]]; then
            echo "chart_version is required when release_chart is true." >&2
            exit 1
          fi

  image-build:
    name: "Build ${{ matrix.role }} image (${{ matrix.platform }})"
    needs: [validate-release]
    if: ${{ inputs.release_images }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: readonly
            image: ghcr.io/sevein/atbox-public
            target: readonly-runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - role: readonly
            image: ghcr.io/sevein/atbox-public
            target: readonly-runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - role: admin
            image: ghcr.io/sevein/atbox-admin
            target: admin-runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - role: admin
            image: ghcr.io/sevein/atbox-admin
            target: admin-runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - role: cli
            image: ghcr.io/sevein/atbox-cli
            target: cli-runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - role: cli
            image: ghcr.io/sevein/atbox-cli
            target: cli-runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - role: worker
            image: ghcr.io/sevein/atbox-worker
            target: worker-runtime
            platform: linux/amd64
            runner: ubuntu-24.04
          - role: worker
            image: ghcr.io/sevein/atbox-worker
            target: worker-runtime
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2

      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd" # v4.0.0

      - name: "Derive platform pair"
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: "Log in to GitHub Container Registry"
        uses: "docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121" # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push to GHCR by digest"
        id: build
        uses: "docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f" # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: |
            ATOM_VERSION=${{ inputs.atom_version }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: "Export GHCR digest"
        run: |
          mkdir -p "${{ runner.temp }}/digests-ghcr-${{ matrix.role }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests-ghcr-${{ matrix.role }}/${digest#sha256:}"

      - name: "Upload GHCR digest"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v4.6.2
        with:
          name: digests-ghcr-${{ matrix.role }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-ghcr-${{ matrix.role }}/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: "Publish ${{ matrix.role }} GHCR manifest"
    runs-on: ubuntu-24.04
    needs: [image-build]
    if: ${{ inputs.release_images }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: readonly
            image: ghcr.io/sevein/atbox-public
          - role: admin
            image: ghcr.io/sevein/atbox-admin
          - role: cli
            image: ghcr.io/sevein/atbox-cli
          - role: worker
            image: ghcr.io/sevein/atbox-worker
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Download GHCR digests"
        uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
        with:
          path: ${{ runner.temp }}/digests-ghcr-${{ matrix.role }}
          pattern: digests-ghcr-${{ matrix.role }}-*
          merge-multiple: true

      - name: "Log in to GitHub Container Registry"
        uses: "docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121" # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up buildx"
        uses: "docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd" # v4.0.0

      - name: "Create manifest list and push to GHCR"
        working-directory: ${{ runner.temp }}/digests-ghcr-${{ matrix.role }}
        run: |
          refs=()
          for digest in *; do
            refs+=("${{ matrix.image }}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${{ matrix.image }}:${{ inputs.image_tag }}" \
            "${refs[@]}"

      - name: "Inspect image"
        run: |
          docker buildx imagetools inspect ${{ matrix.image }}:${{ inputs.image_tag }}

  chart-publish:
    name: "Publish Helm chart"
    runs-on: ubuntu-24.04
    needs: [validate-release, image-merge]
    if: ${{ always() && inputs.release_chart && needs.validate-release.result == 'success' && ((!inputs.release_images && needs.image-merge.result == 'skipped') || (inputs.release_images && needs.image-merge.result == 'success')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2

      - name: "Install Nix"
        uses: "DeterminateSystems/determinate-nix-action@v3"

      - name: "Log in to GitHub Container Registry"
        uses: "docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121" # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Log Helm in to GitHub Container Registry"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | nix develop --command helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: "Package Helm chart"
        run: |
          nix develop --command helm dependency update charts/atbox
          nix develop --command helm lint charts/atbox --values charts/atbox/values-readonly-attached.yaml
          nix develop --command helm lint charts/atbox --values charts/atbox/values-admin-attached.yaml
          nix develop --command helm lint charts/atbox --values charts/atbox/values-public-plus-admin.yaml
          nix develop --command helm unittest charts/atbox
          nix develop --command ./hack/helm-kubeconform.sh
          nix develop --command helm package charts/atbox \
            --version "${{ inputs.chart_version }}" \
            --app-version "${{ inputs.image_tag }}" \
            --destination "${{ runner.temp }}"

      - name: "Push Helm chart to GHCR"
        run: |
          nix develop --command helm push "${{ runner.temp }}/atbox-${{ inputs.chart_version }}.tgz" oci://${{ env.GHCR_NAMESPACE }}/charts
