name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.7.0
      HELM_UNITTEST_VERSION: v1.0.3
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Lint chart presets
        run: |
          helm lint charts/atbox --values charts/atbox/values-readonly-attached.yaml
          helm lint charts/atbox --values charts/atbox/values-admin-attached.yaml
          helm lint charts/atbox --values charts/atbox/values-public-plus-admin.yaml
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "${HELM_UNITTEST_VERSION}"
      - name: Run Helm unit tests
        run: helm unittest charts/atbox
      - name: Render chart presets
        run: |
          helm template atbox charts/atbox --values charts/atbox/values-readonly-attached.yaml >/dev/null
          helm template atbox charts/atbox --values charts/atbox/values-admin-attached.yaml >/dev/null
          helm template atbox charts/atbox --values charts/atbox/values-public-plus-admin.yaml >/dev/null
      - name: Install kubeconform
        run: |
          curl -LfsS "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xzf - kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Validate rendered chart manifests
        run: ./hack/helm-kubeconform.sh

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROJECT_NAME: atbox-integration
      KEEP_UP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run integration harness
        run: ./hack/integration/run.sh
      - name: Collect compose diagnostics
        if: always()
        run: |
          mkdir -p hack/integration/output
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml ps -a > hack/integration/output/compose-ps.txt || true
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml logs --no-color > hack/integration/output/compose-logs.txt || true
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4.6.2
        with:
          name: integration-output
          path: hack/integration/output
          if-no-files-found: warn
      - name: Tear down integration stack
        if: always()
        run: |
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml down -v --remove-orphans || true
