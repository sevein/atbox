name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Helm
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - name: Lint chart presets
        run: |
          nix develop --command helm lint charts/atbox --values charts/atbox/values-readonly-attached.yaml
          nix develop --command helm lint charts/atbox --values charts/atbox/values-admin-attached.yaml
          nix develop --command helm lint charts/atbox --values charts/atbox/values-public-plus-admin.yaml
      - name: Run Helm unit tests
        run: nix develop --command helm unittest charts/atbox
      - name: Render chart presets
        run: |
          nix develop --command helm template atbox charts/atbox --values charts/atbox/values-readonly-attached.yaml >/dev/null
          nix develop --command helm template atbox charts/atbox --values charts/atbox/values-admin-attached.yaml >/dev/null
          nix develop --command helm template atbox charts/atbox --values charts/atbox/values-public-plus-admin.yaml >/dev/null
      - name: Validate rendered chart manifests
        run: nix develop --command ./hack/helm-kubeconform.sh

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROJECT_NAME: atbox-integration
      KEEP_UP: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run integration harness
        run: ./hack/integration/run.sh
      - name: Collect compose diagnostics
        if: always()
        run: |
          mkdir -p hack/integration/output
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml ps -a > hack/integration/output/compose-ps.txt || true
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml logs --no-color > hack/integration/output/compose-logs.txt || true
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: integration-output
          path: hack/integration/output
          if-no-files-found: warn
      - name: Tear down integration stack
        if: always()
        run: |
          docker compose -p "${PROJECT_NAME}" -f hack/integration/docker-compose.yml down -v --remove-orphans || true
